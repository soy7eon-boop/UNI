<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#273d3a"><title>RECIPE BOOK · LIFE BOOK</title>
<style>
:root{--bg:#f6f7f5;--white:#fff;--ink:#23312e;--muted:#76817d;--line:#e1e7e2;--accent:#314e45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:820px;margin:auto;padding:27px 16px 70px}header,.heading,.toolbar,.buttons{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.eyebrow{font-size:11px;letter-spacing:.13em;color:var(--muted);font-weight:750}.brand{font-size:28px;font-weight:900;letter-spacing:.045em;margin:3px 0}.status{font-size:12px;color:var(--muted)}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:10px 13px;border-radius:11px;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{color:#ad3939}.intro{background:var(--accent);color:white;border-radius:18px;padding:24px;margin:22px 0 26px}.intro h1{font-size:23px;margin:0 0 9px}.intro p{color:#d6e2dc;line-height:1.6;margin:0;font-size:13px}.heading{margin-bottom:13px}.heading h2{margin:0;font-size:19px}.toolbar{margin:0 0 14px}.search{width:100%;border:1px solid var(--line);border-radius:12px;background:white;padding:13px 14px;outline:none}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:14px;background:white;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:14px}.item h3{font-size:17px;margin:0 0 6px}.item p{font-size:13px;color:var(--muted);margin:0;line-height:1.5;white-space:pre-line}.empty{text-align:center;background:white;border:1px dashed var(--line);border-radius:14px;padding:45px 10px;color:var(--muted)}.note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:22px}.modal{display:none;position:fixed;inset:0;background:#17231ecc;z-index:20;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.dialog{width:min(100%,660px);max-height:95dvh;overflow:auto;background:white;border-radius:17px;padding:20px}.section{margin:17px 0}.section label{font-size:13px;font-weight:800;display:block;margin:0 0 7px}.section input,.section textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;outline:none}.section textarea{resize:vertical;min-height:112px;line-height:1.6}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.view pre{white-space:pre-wrap;word-wrap:break-word;font:inherit;line-height:1.75;margin:8px 0 20px}.view h3{font-size:15px;margin:19px 0 0}.meta{font-size:13px;color:var(--muted)}.viewname{font-size:23px;margin:4px 0 8px}.hidden{display:none}@media(max-width:480px){.brand{font-size:23px}.btn{padding:9px 11px}.dialog{padding:15px}.pair{grid-template-columns:1fr 1fr}.intro{padding:20px}}
</style></head><body><main class="wrap">
<header><div><div class="eyebrow">LIFE BOOK / MY KITCHEN</div><div class="brand">RECIPE BOOK</div></div><div class="buttons"><button class="btn" id="backup">백업</button><button class="btn" id="restore">복원</button><input id="file" type="file" accept="application/json,.json" hidden></div></header>
<section class="intro"><h1>나만의 레시피 기록</h1><p>필요한 재료와 만드는 방법을 간단하게 정리하세요.<br>레시피는 현재 브라우저에 자동 저장됩니다.</p></section>
<div class="heading"><h2>내 레시피 <span id="count" class="meta"></span></h2><button class="btn primary" id="new">+ 레시피 추가</button></div><div class="toolbar"><input class="search" id="search" placeholder="요리 이름, 재료, 조리 순서 검색" aria-label="레시피 검색"></div><div id="list" class="list"></div><p class="note" id="status">브라우저에 자동 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 삭제하기 전에는 백업해 주세요. PC와 아이폰 간 자동 동기화는 아직 지원하지 않습니다.</p>
</main>
<div class="modal" id="editor" role="dialog" aria-modal="true" aria-label="레시피 편집"><div class="dialog"><div class="heading"><h2 id="editTitle">레시피 추가</h2><button class="btn" id="closeEdit">닫기</button></div><form id="form"><div class="section"><label for="name">요리 이름 *</label><input id="name" maxlength="120" required placeholder="예: 부드러운 계란찜"></div><div class="pair"><div class="section"><label for="minutes">조리 시간 (분)</label><input id="minutes" type="number" min="0" max="9999" placeholder="20"></div><div class="section"><label for="servings">인분</label><input id="servings" type="number" min="1" max="100" placeholder="2"></div></div><div class="section"><label for="ingredients">재료 *</label><textarea id="ingredients" required placeholder="계란 3개&#10;우유 100ml&#10;소금 약간"></textarea></div><div class="section"><label for="steps">조리 순서 *</label><textarea id="steps" required rows="6" placeholder="계란을 풀어준다.&#10;우유와 소금을 넣는다.&#10;약불에서 익힌다."></textarea></div><div class="section"><label for="memo">요리 팁 · 메모 (선택)</label><textarea id="memo" placeholder="다음에 만들 때 기억할 점"></textarea></div><div class="buttons"><button class="btn primary" type="submit">저장하기</button><button class="btn" type="button" id="cancel">취소</button></div></form></div></div>
<div class="modal" id="viewer" role="dialog" aria-modal="true" aria-label="레시피 내용"><div class="dialog view"><div class="heading"><div><div class="eyebrow">RECIPE</div><h2 class="viewname" id="viewName"></h2><div class="meta" id="viewMeta"></div></div><button class="btn" id="closeView">닫기</button></div><h3>재료</h3><pre id="viewIngredients"></pre><h3>조리 순서</h3><pre id="viewSteps"></pre><div id="memoWrap"><h3>메모</h3><pre id="viewMemo"></pre></div><div class="buttons"><button class="btn primary" id="viewEdit">수정</button><button class="btn danger" id="viewDelete">삭제</button></div></div></div>
<script>
(()=>{'use strict';
const KEY='wooni-recipe-book-v1', $=id=>document.getElementById(id);
let recipes=[],editing=null,viewing=null;
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');recipes=Array.isArray(a)?a:[]}catch{recipes=[];showStatus('저장된 데이터 읽기 실패. 백업 파일을 확인해 주세요.')}}
function showStatus(message){$('status').textContent=message}
function persist(){try{const s=JSON.stringify(recipes);localStorage.setItem(KEY,s);if(localStorage.getItem(KEY)!==s)throw Error('failed');showStatus('✓ 저장 완료 · 이 브라우저에 자동 저장됩니다. 다른 기기와 공유하려면 백업/복원을 사용해 주세요.');return true}catch{showStatus('⚠ 저장 실패 · 백업을 확인해 주세요.');return false}}
function render(){const q=$('search').value.trim().toLowerCase();const shown=recipes.filter(r=>[r.name,r.ingredients,r.steps,r.memo].some(x=>String(x||'').toLowerCase().includes(q))).sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));$('count').textContent=recipes.length+'개';$('list').innerHTML=shown.map(r=>`<div class="item"><div><h3>${esc(r.name)}</h3><p>${esc(String(r.ingredients||'').split('\n').slice(0,2).join(' · '))}</p></div><button class="btn primary" data-open="${esc(r.id)}">보기</button></div>`).join('')||'<div class="empty">레시피가 없습니다.<br>새 레시피를 추가해 보세요.</div>'}
function openEdit(id){const r=recipes.find(x=>x.id===id);editing=r?.id||null;$('editTitle').textContent=r?'레시피 수정':'레시피 추가';for(const k of ['name','minutes','servings','ingredients','steps','memo'])$(k).value=r?.[k]??'';$('viewer').classList.remove('show');$('editor').classList.add('show')}
function closeEdit(){$('editor').classList.remove('show');editing=null}
function openView(id){const r=recipes.find(x=>x.id===id);if(!r)return;viewing=id;$('viewName').textContent=r.name;$('viewMeta').textContent=[r.minutes?`${r.minutes}분`:null,r.servings?`${r.servings}인분`:null].filter(Boolean).join(' · ');$('viewIngredients').textContent=r.ingredients||'';$('viewSteps').textContent=String(r.steps||'').split('\n').filter(s=>s.trim()).map((s,i)=>`${i+1}. ${s}`).join('\n');$('viewMemo').textContent=r.memo||'';$('memoWrap').classList.toggle('hidden',!r.memo);$('viewer').classList.add('show')}
function closeView(){$('viewer').classList.remove('show');viewing=null}
$('new').onclick=()=>openEdit(null);$('closeEdit').onclick=$('cancel').onclick=closeEdit;$('closeView').onclick=closeView;$('search').oninput=render;$('list').onclick=e=>{const el=e.target.closest('[data-open]');if(el)openView(el.dataset.open)};
$('form').onsubmit=e=>{e.preventDefault();const obj={name:$('name').value.trim(),minutes:$('minutes').value?Number($('minutes').value):null,servings:$('servings').value?Number($('servings').value):null,ingredients:$('ingredients').value.trim(),steps:$('steps').value.trim(),memo:$('memo').value.trim()};if(!obj.name||!obj.ingredients||!obj.steps)return;const old=recipes.find(x=>x.id===editing);const previous=JSON.stringify(recipes);if(old)Object.assign(old,obj,{updatedAt:new Date().toISOString()});else recipes.push({...obj,id:uid(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});if(!persist()){recipes=JSON.parse(previous);alert('저장에 실패했습니다.');return}closeEdit();render()};
$('viewEdit').onclick=()=>openEdit(viewing);$('viewDelete').onclick=()=>{if(!confirm('이 레시피를 삭제할까요?'))return;const prev=recipes;recipes=recipes.filter(r=>r.id!==viewing);if(!persist()){recipes=prev;alert('삭제를 저장하지 못했습니다.');return}closeView();render()};
$('backup').onclick=()=>{const blob=new Blob([JSON.stringify({format:KEY,exportedAt:new Date().toISOString(),recipes},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='recipe-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};
$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const v=JSON.parse(await file.text());if(!Array.isArray(v.recipes))throw Error('format');if(!confirm('백업 레시피를 현재 기록에 합칠까요? 기존 레시피는 유지됩니다.'))return;const previous=recipes.slice(),ids=new Set(recipes.map(r=>String(r.id)));let count=0;for(const item of v.recipes){if(item?.id&&typeof item.name==='string'&&typeof item.ingredients==='string'&&typeof item.steps==='string'&&!ids.has(String(item.id))){recipes.push(item);ids.add(String(item.id));count++}}if(!persist()){recipes=previous;throw Error('storage')}render();alert(count+'개의 레시피를 가져왔습니다.')}catch{alert('백업 파일을 불러오지 못했습니다.')}finally{e.target.value=''}};
for(const id of ['editor','viewer'])$(id).addEventListener('click',e=>{if(e.target===$(id))id==='editor'?closeEdit():closeView()});
load();render();
})();
</script></body></html>
